# NVIDIA GPU 패스스루. nvidia-container-toolkit 이 설치된 머신에서만 쓴다
# (setup.sh 가 감지해서 .env 의 COMPOSE_FILE 에 넣는다).
services:
  hermes:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
