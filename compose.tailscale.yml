# Tailscale 사이드카 — 이 머신 전용 tailnet 노드(TS_HOSTNAME)를 띄우고 tailnet 에만 포트를 노출한다.
# 호스트의 tailscale 과 무관하다. userspace 모드라 /dev/net/tun·추가 권한이 필요 없다.
# 노드 상태는 ./tailscale/state 에 저장되어 재시작·재부팅 후에도 로그인이 유지된다.
# setup.sh 가 생성하는 docker-compose.override.yml 이 extends 로 불러와 노드 이름(hermes-<호스트명>)을 붙인다.
# 첫 로그인: .env 의 TS_AUTHKEY, 또는 비워두면 로그에 나오는 로그인 URL (./setup.sh 가 보여줌).
#
# 노출 규칙: ./tailscale/config/serve.json (setup.sh 가 생성) — :9119 → hermes:9119, hub 머신은 :80 → hub:8800.
#   파일이 아니라 폴더를 마운트해야 변경이 컨테이너에 inotify 로 전달되어 재시작 없이 반영된다.
# SOCKS5 :1055 — compose 네트워크 안에서만 (포트 공개 안 함, 인증 없음). link 가 tailnet 의 hub 에 접속할 때 쓴다.
# HTTP 프록시 :1056 — 마찬가지로 compose 네트워크 전용. userspace 모드라 다른 컨테이너에는 tailnet
#   경로가 없으므로, hermes 가 tailnet 의 HTTP 엔드포인트(예: LLM_BASE_URL 이 100.x 인 GLM 서버)에
#   붙으려면 이 프록시가 유일한 통로다. setup.sh 가 HTTP(S)_PROXY 로 꽂아 준다.
services:
  tailscale:
    image: tailscale/tailscale:${TS_IMAGE_TAG:-stable}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}-tailscale
    hostname: ${TS_HOSTNAME:-hermes}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-hermes}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_SOCKS5_SERVER=:1055
      - TS_OUTBOUND_HTTP_PROXY_LISTEN=:1056
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/config:/config:ro

  # tailnet 의 HTTP 엔드포인트를 compose 네트워크의 평범한 주소로 — hermes 는 http://llm-tailnet:18000/v1
  # 로 그냥 붙는다. 게이트웨이가 s6 때문에 HTTP_PROXY 를 못 받기 때문이다 (docker/tailnet-forward.py 참고).
  # setup.sh 가 LLM_BASE_URL 이 http:// tailnet 주소일 때만 override 에서 extends 로 붙이고
  # FWD_TARGET 을 채운다. 별도 이미지 없이 Hermes 이미지의 Python 으로 돈다.
  llm-tailnet:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}-llm-tailnet
    restart: unless-stopped
    init: true
    entrypoint: ["/opt/hermes/.venv/bin/python", "/app/tailnet-forward.py"]
    command: []
    environment:
      - PYTHONUNBUFFERED=1
      - FWD_LISTEN=18000
      - FWD_PROXY=tailscale:1056
    volumes:
      - ./docker/tailnet-forward.py:/app/tailnet-forward.py:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
