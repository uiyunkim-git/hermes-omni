# Tailscale 사이드카 — 이 머신 전용 tailnet 노드(TS_HOSTNAME)를 띄우고 tailnet 에만 :9119 를 노출한다.
# 호스트의 tailscale 과 무관하다. userspace 모드라 /dev/net/tun·추가 권한이 필요 없다.
# 노드 상태는 ./tailscale/state 에 저장되어 재시작·재부팅 후에도 로그인이 유지된다.
# 첫 로그인: .env 의 TS_AUTHKEY, 또는 비워두면 로그에 나오는 로그인 URL (./setup.sh 가 보여줌).
services:
  tailscale:
    image: tailscale/tailscale:${TS_IMAGE_TAG:-stable}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}-tailscale
    hostname: ${TS_HOSTNAME:?run ./setup.sh first}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_AUTH_ONCE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
