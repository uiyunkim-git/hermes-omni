# =====================================================================================
#  Hermes Agent — Hermes Desktop 원격 백엔드 (GPU + Docker 패스스루 + Tailscale)
#
#  처음이면: ./setup.sh   (.env 입력 → 머신 감지 → docker-compose.override.yml 생성 → 실행)
#  이후:     docker compose up -d / logs -f / pull     (이 폴더에서)
#
#  - .env 에는 사람이 정하는 값만 (LLM, 로그인, Tailscale). 모델·작업 폴더는 컨테이너 부팅마다
#    config.yaml 에 반영된다 (docker/cont-init.d/10-env-config).
#  - 머신마다 다른 것(GPU, 작업 폴더 절대 경로, Tailscale 노드)은 setup.sh 가 생성하는
#    docker-compose.override.yml 에 있다 (git 제외, compose 가 자동으로 읽음).
#  - 모든 상태는 이 폴더 안: ./data (= /opt/data: config, 세션, 메모리, 스킬, 자동 생성 비밀값),
#    ./workspace, ./tailscale/state, ./omni-state (link/hub 상태)
#  - Docker: 호스트 docker.sock 패스스루 (= 호스트 root 권한). 소켓 GID 는 이미지가 자동으로 맞춤.
#  - hermes-omni: link(모든 머신)·hub(hub 머신) 서비스는 compose.omni.yml 템플릿을 override 가 extends 로 붙인다.
# =====================================================================================
services:
  hermes:
    # 검증된 빌드(v0.21.5 · 749220ef)에 고정. 일치하는 태그가 없어 digest 로 고정한다 (.env 의 HERMES_IMAGE 로 변경 가능).
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: .env
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # 이미지의 수정된 SQLite(/usr/local/lib, WAL-reset 버그 수정판)를 우선 사용. NVIDIA 런타임 훅이
      # ld.so.cache 를 다시 만들면 시스템 SQLite 3.46.1(데이터 유실 버그)이 먼저 잡히기 때문.
      - LD_LIBRARY_PATH=/usr/local/lib
    ports:
      # 호스트 쪽은 기본 loopback 만. 원격 접속은 Tailscale 사이드카로.
      - "${HERMES_BIND:-127.0.0.1}:${HERMES_PORT:-9119}:9119"
    volumes:
      - ./data:/opt/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./docker/cont-init.d/10-env-config:/etc/cont-init.d/10-env-config:ro
